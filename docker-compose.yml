services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: acs_local_dev
      POSTGRES_DB: acs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs -d acs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: acs_minio
      MINIO_ROOT_PASSWORD: acs_minio_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 acs_minio acs_minio_local_dev &&
      mc mb --ignore-existing local/acs-knowledge &&
      mc mb --ignore-existing local/acs-attachments
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
