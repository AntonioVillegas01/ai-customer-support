<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3001 https:; img-src 'self' data:; frame-ancestors *"
    />
    <title>Support chat</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
